[package]
name = "kryptrustbackend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
shuttle = { version = "0.6.1", features = ["tokio"] }

axum = "0.7.3"

tokio-postgres = "0.7"

shuttle-axum = "0.37.0"
shuttle-runtime = "0.37.0"
tracing = "0.1.40"
postgres = "0.19"
serde = "1.0" # to serialize and deserialize json format
serde_json = "1.0" # specific to json
serde_derive = "1.0"

